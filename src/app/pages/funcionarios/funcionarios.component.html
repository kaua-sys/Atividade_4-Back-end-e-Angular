
<h2>{{ editandoId ? 'Editar funcionário' : 'Cadastrar funcionário' }}</h2>

<form (ngSubmit)="salvar()">

  <label>Nome:</label>
  <input type="text" name="nome" [(ngModel)]="novoFuncionario.pessoa.nome"required>

  <label>CPF:</label>
  <input type= "text" name="cpf" [(ngModel)]="novoFuncionario.pessoa.cpf"required>

  <label>E-mail:</label>
  <input type="email" name="email" [(ngModel)]="novoFuncionario.pessoa.email" required>

  <label>Telefone:</label>
  <input type="text" name="telefone"  [(ngModel)]="novoFuncionario.pessoa.telefone" required>

  <label>Data de nascimento:</label>
  <input type="date"  name="dataNascimento"  [(ngModel)]="novoFuncionario.pessoa.dataNascimento"  required>

  <label>Cargo:</label>
  <input type="text" name="cargo" [(ngModel)]="novoFuncionario.cargo" required>

  <label>Data de admissão:</label>
  <input type="date" name="dataAdmissao" [(ngModel)]="novoFuncionario.dataAdmissao" required>

  <button type="submit">{{ editandoId ? 'Salvar alterações' : 'Cadastrar' }}</button>
  
</form>

<h1>Lista de funcionários</h1>

<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>Cargo</th>
      <th>Data de admissão</th>
      <th>Ações</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let funcionario of funcionarios">
      <td>
        {{ funcionario.pessoa?.nome || funcionario.nome }}
      </td>

      <td>
        {{ funcionario.cargo || 'Não informado' }}
      </td>

      <td>
        {{ funcionario.dataAdmissao || 'Não informada' }}
      </td>

      <td>
        <button type="button" (click)="editar(funcionario)">Editar</button>
       <button type="button"(click)="excluir(funcionario.idPessoa)">Excluir</button>
      </td>
    </tr>
  </tbody>
</table>
