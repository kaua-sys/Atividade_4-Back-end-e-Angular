<h2>Cadastrar funcionário</h2>

<form>
  <label>Nome:</label>
  <input type="text" name="nome" required [(ngModel)] = "nome" >

  <label>CPF:</label>
  <input type="text" name="cpf" required>

  <label>E-mail:</label>
  <input type="email" name="email" required>

  <label>Cargo:</label>
  <input type="text" name="cargo" required>

  <label>Data de admissão:</label>
  <input type="date" name="dataAdmissao" required>

  <button type="submit">Cadastrar</button>

  
</form>

<h1>Lista de funcionários</h1>

<table>
  <thead>
    <th>Ações</th>

    <tr>
      <th>Nome</th>
      <th>Cargo</th>
      <th>Data de admissão</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let funcionario of funcionarios">
      <td>
        {{ funcionario.pessoa?.nome || funcionario.nome }}
      </td>

      <td>
        {{ funcionario.cargo || 'Não informado' }}
      </td>

      <td>
        {{ funcionario.dataAdmissao || 'Não informada' }}
      </td>

      <td>
        <button type="button">Editar</button>
       <button type="button"(click)="excluir(funcionario.idPessoa)">Excluir</button>
      </td>
    </tr>
  </tbody>
</table>
