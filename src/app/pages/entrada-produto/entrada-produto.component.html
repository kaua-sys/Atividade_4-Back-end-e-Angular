<div class="pagina-entrada">
  <h1>Entrada de Produtos</h1>

  <form (ngSubmit)="salvar()">

    <label>Produto:</label>
    <select name="iditem" [(ngModel)]="entrada.iditem" required>
      <option [ngValue]="0">Selecione um produto</option>
      <option *ngFor="let produto of produtos" [ngValue]="produto.iditem">
        {{ produto.item?.item1 }}
      </option>
    </select>

    <label>Quantidade:</label>
    <input
      type="number"
      name="quantidade"
      [(ngModel)]="entrada.quantidadeEntrada"
      min="1"
      required>

    <label>Data da entrada:</label>
    <input
      type="date"
      name="data"
      [(ngModel)]="entrada.dataEntradaProduto"
      required>

    <label>Valor unitário de entrada:</label>
    <input
      type="number"
      name="valor"
      [(ngModel)]="entrada.valorUnitarioEntrada"
      min="0.01"
      step="0.01"
      required>

    <button type="submit">Registrar entrada</button>
  </form>
</div>
