
<h1>Carrinho</h1>

<div *ngIf="carrinho.length === 0">
  <p>Seu carrinho está vazio.</p>
  <a routerLink="/catalogo">Voltar ao catálogo</a>
</div>

<div *ngIf="carrinho.length > 0">

  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Valor unitário</th>
        <th>Quantidade</th>
        <th>Subtotal</th>
        <th>Ação</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of carrinho">
        <td>{{ item.nome }}</td>
        <td>{{ item.preco | currency:'BRL' }}</td>

        <td>
          <button (click)="diminuir(item)">-</button>
          {{ item.quantidade }}
          <button (click)="aumentar(item)">+</button>
        </td>

        <td>
          {{ item.preco * item.quantidade | currency:'BRL' }}
        </td>

        <td>
          <button (click)="remover(item)">Remover</button>
        </td>
      </tr>
    </tbody>
  </table>

  <h2>Total: {{ calcularTotal() | currency:'BRL' }}</h2>

  <button (click)="limpar()">Limpar carrinho</button>
  <button (click)="confirmar()">Confirmar pedido</button>

</div>
