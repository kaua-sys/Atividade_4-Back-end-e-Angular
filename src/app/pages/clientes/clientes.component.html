
<div class="pagina-clientes">

  <h1>Gestão de Clientes</h1>
  <p class="subtitulo">Cadastre e gerencie seus clientes.</p>

  <section class="card">
    <h2>{{ cliente.idPessoa ? 'Editar cliente' : 'Cadastrar cliente' }}</h2>

    <form (ngSubmit)="cadastrar()">

      <div class="campo">
        <label>Nome:</label>
        <input name="nome" [(ngModel)]="cliente.nome" required>
      </div>

      <div class="campo">
        <label>CPF:</label>
        <input type="text" name="cpf" [(ngModel)]="cliente.cpf" required>
      </div>

      <div class="campo">
        <label>Data de nascimento:</label>
        <input type="date" name="dataNascimento"
          [(ngModel)]="cliente.dataNascimento" required>
      </div>

      <div class="campo">
        <label>Sexo:</label>
        <select name="sexo" [(ngModel)]="cliente.sexo" required>
          <option value="M">Masculino</option>
          <option value="F">Feminino</option>
        </select>
      </div>

      <div class="campo">
        <label>E-mail:</label>
        <input type="email" name="email"
          [(ngModel)]="cliente.email" required>
      </div>

      <div class="campo">
        <label>Telefone:</label>
        <input type="text" name="telefone"
          [(ngModel)]="cliente.telefone" required>
      </div>

      <!-- Endereços -->
<div class="enderecos">
  <h3>Endereços do cliente</h3>

  <div class="endereco" *ngFor="let endereco of cliente.enderecos; let i = index">

    <h4>Endereço {{ i + 1 }}</h4>

    <div class="campo">
      <label>CEP:</label>
      <input
        type="text"
        [name]="'cep' + i"
        [(ngModel)]="endereco.cep"
        maxlength="8"
        placeholder="Somente números"
        required>
    </div>

    <div class="campo">
      <label>Número:</label>
      <input
        type="text"
        [name]="'numero' + i"
        [(ngModel)]="endereco.numero"
        required>
    </div>

    <div class="campo">
      <label>Complemento:</label>
      <input
        type="text"
        [name]="'complemento' + i"
        [(ngModel)]="endereco.complemento">
    </div>

    <button
      type="button"
      class="btn-excluir"
      (click)="removerEndereco(i)">
      Remover endereço
    </button>

  </div>

  <button
    type="button"
    class="btn-adicionar"
    (click)="adicionarEndereco()">
    + Adicionar endereço
  </button>
</div>

      <div class="botoes">
        <button type="submit" class="btn-salvar">
          {{ cliente.idPessoa ? 'Salvar alterações' : 'Cadastrar cliente' }}
        </button>

        <button type="button" class="btn-cancelar"
          *ngIf="cliente.idPessoa" (click)="limparFormulario()">
          Cancelar
        </button>
      </div>

    </form>
  </section>

  <section class="card">
    <h2>Lista de clientes</h2>

    <div class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let c of clientes">
            <td>{{ c.nome }}</td>
            <td>{{ c.email }}</td>
            <td>{{ c.telefone }}</td>
            <td class="acoes">
              <button class="btn-editar" (click)="editar(c)">
                Editar
              </button>
              <button class="btn-excluir" (click)="excluir(c.idPessoa)">
                Excluir
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</div>
