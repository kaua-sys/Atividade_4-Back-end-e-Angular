<h2>{{ cliente.idPessoa ? 'Editar cliente' : 'Cadastrar cliente' }}</h2>

<form (ngSubmit)="cadastrar()">
  <label>Nome:</label>
  <input name="nome" [(ngModel)]="cliente.nome" required>

  <label>CPF:</label>
  <input type="text" name="cpf" [(ngModel)]="cliente.cpf" required>

  <label>Data de nascimento:</label>
  <input type="date" name="dataNascimento" [(ngModel)]="cliente.dataNascimento" required>

  <label>Sexo:</label>
  <select name="sexo" [(ngModel)]="cliente.sexo" required>
    <option value="M">Masculino</option>
    <option value="F">Feminino</option>
  </select>

  <label>E-mail:</label>
  <input type="email" name="email" [(ngModel)]="cliente.email" required>

  <label>Telefone:</label>
  <input type="text" name="telefone" [(ngModel)]="cliente.telefone" required>

  <button type="submit">
  {{ cliente.idPessoa ? 'Salvar alterações' : 'Cadastrar' }}
  </button>

 <button type="button" *ngIf="cliente.idPessoa" (click)="cliente = {}">
  Cancelar
</button>
</form>

<h1>Lista de clientes</h1>

<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>E-mail</th>
      <th>Telefone</th>
      <th>Ações</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let c of clientes">
      <td>{{ c.nome }}</td>
      <td>{{ c.email }}</td>
      <td>{{ c.telefone }}</td>
      <td>
        <button (click)="editar(c)">Editar</button>
        <button (click)="excluir(c.idPessoa)">Excluir</button>
      </td>
    </tr>
  </tbody>
</table>
