<h1>Catálogo de produtos e serviços</h1>

<div class="pesquisa">
    <input type="text"placeholder="Pesquisar produto ou serviço..." [(ngModel)]="pesquisa"(ngModelChange)="filtrarProdutos()"></div>

<p *ngIf="mensagemErro"> {{ mensagemErro }}</p>

<div class="catalogo">
    <div class="produto" *ngFor="let produto of produtosFiltrados">
      <h2>{{ produto.item?.item1 }}</h2>

      <p>{{ produto.item?.descricaoItem }}</p>
      
      <p><strong>Preço:</strong>{{ produto.precoVenda | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}</p>
      
      <p> <strong>Tipo:</strong> {{ produto.item?.tipoItem === 'P' ? 'Produto' : 'Serviço' }}</p>

    <button (click)="adicionarAoCarrinho(produto)">Adicionar ao carrinho</button>
  </div>
</div>

<p *ngIf="produtosFiltrados.length === 0 && !mensagemErro">
    Nenhum produto ou serviço encontrado.
</p>
